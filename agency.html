<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agency</title>
    <style>
      img {
        width: 200px;
        height: auto;
      }

      .beauty {
        display: inline;
        width: 50%;
      }

      div > div{
        display: inline-block;
        vertical-align: top;
        width: 30%;
        margin-top: 30px;
        margin-left: 40px;
      }

      h2 {
        font-size: 24px;
      }

      @media (max-width: 600px) {
        .beauty {
          display: block;
        }

        div > div {
          width: 100%;
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <h1 class="h1">dev.com</h1>

    <h2>We are a <span>Creative</span> Design Agency</h2>

    <div class="beauty">
      <img src="./images/cat.jpg" alt="Cat" />
      <div>
        <h3>Beauty</h3>
        <p>
          We strive to create beautiful and functional designs that exceed our
          clients' expectations.
        </p>
      </div>
    </div>

    <div class="beauty">
      <img src="./images/cat.jpg" alt="Cat" />

        <h3>Beauty</h3>

          We strive to create beautiful and functional designs that exceed our
          clients' expectations.
        </p>
      </div>

  </body>
</html>
